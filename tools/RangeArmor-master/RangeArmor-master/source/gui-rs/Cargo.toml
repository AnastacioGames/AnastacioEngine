[package]
name = "rangearmor_panel"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
directories = "6.0.0"
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["image"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
winres = "0.1.12"

[package.metadata.winres]
FileDescription = "RangeArmor: Game packer and launcher."
ProductName = "RangeArmor Panel"
OriginalFilename = "RangeArmor Panel.exe"
LegalCopyright = "MIT"
CompanyName = "RangeEngine"
