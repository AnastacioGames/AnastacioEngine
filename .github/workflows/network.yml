# Network core (source/source/gameengine/Network): isolated build and tests on Linux, Windows and
# wasm32, the multiplayer menu tests and the dedicated server image. See Network/NOTES-J.md.
name: Network

on:
  push:
    paths:
      - "source/source/gameengine/Network/**"
      - "source/extern/enet/**"
      - "tools/net_menu/**"
      - ".github/workflows/network.yml"
  pull_request:
    paths:
      - "source/source/gameengine/Network/**"
      - "source/extern/enet/**"
      - "tools/net_menu/**"
      - ".github/workflows/network.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-${{ github.ref }}
  cancel-in-progress: true

env:
  NET_SRC: source/source/gameengine/Network
  # Emscripten release the wasm build was checked with.
  EMSDK_VERSION: "6.0.11"

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S "$NET_SRC" -B build-net -DNET_STANDALONE=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash  # pipefail: a failed build fails the step despite tee
        run: cmake --build build-net -j "$(nproc)" 2>&1 | tee build.log
      - name: Warnings in the network core
        # -Wall -Wextra are on for the core; list any warning outside source/extern.
        run: |
          if grep -E "warning:" build.log | grep -v "source/extern/"; then
            echo "::warning::compiler warnings in the network core"
          fi
      - name: Test
        run: ctest --test-dir build-net --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S "$env:NET_SRC" -B build-net -DNET_STANDALONE=ON
      - name: Build
        run: cmake --build build-net --config Release -j
      - name: Test
        run: ctest --test-dir build-net -C Release --output-on-failure

  wasm:
    name: wasm32 (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # global WebSocket, used by the wasm client
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Configure
        run: emcmake cmake -S "$NET_SRC" -B build-wasm -DNET_STANDALONE=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build ge_network, net_tests and net_web_echo
        run: cmake --build build-wasm -j "$(nproc)"
      - name: Core tests in node
        # Bitstream, messages, snapshot and golden files: the same bytes as x64 (contract, stage 0).
        # Socket and ENet tests are left out by the filter in CMakeLists.txt.
        run: ctest --test-dir build-wasm --output-on-failure
      - name: Build net_echo (x64)
        run: |
          cmake -S "$NET_SRC" -B build-net -DNET_STANDALONE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-net -j "$(nproc)" --target net_echo
      - name: Web client against net_echo
        run: $NET_SRC/tools/web_echo_test.sh build-net/net_echo build-wasm/net_web_echo.js 17778

  menu:
    name: Menu (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tools/net_menu/tests

  docker:
    name: Server image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f "$NET_SRC/tools/net_server/Dockerfile" -t anastacio-net-server .
      - name: Smoke test
        run: |
          docker run -d --name net-server -p 7777:7777/udp -p 7778:7778 anastacio-net-server
          sleep 2
          docker logs net-server
          docker logs net-server 2>&1 | grep -q "WebSocket on TCP port 7778"
          docker rm -f net-server
